<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="">
    <title>Nook Resort | Contact</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
    <header>
        <h1>Nook Resort</h1>
        <nav>
            <ul>
                <li> <a href="index.html">Home</a></li>
                <li> <a href="accom">Accommodations</a></li>
                <li> <a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <section id="hero-img">
            <img src="images/swiss-valley.jpg" alt="image of a valley with bright and fresh greenery and a small stream or river going through the valley, with snowy mountains in the background behind the valley">
        </section>
    </header>

    <main>
        <h2>Contact Us</h2>
        <p>Please reach out to us with any questions or concerns. We are happy to help you plan your dream vacation with us! Required fields marked with a *</p>
        <img src="images/swiss-sunset.jpg" alt="mountains by a river with cabins along it and a warm red sunset behind a wooded area">

        <form action="https://wp.zybooks.com/form-viewer.php" method="post">
            <label for="name">Full Name:* </label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:* </label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:* </label>
            <input type="tel" id="phone" name="phone" required>

            <label>Preferred Contact Method - *</label>
            <div>
                <label for="prefem">Email:</label>
                <input type="radio" id="prefem" name="preferred" value="prefem">
            </div>
            <div>
                <label for="preftel">Phone:</label>
                <input type="radio" id="preftel" name="preferred" value="preftel" checked>
            </div>

            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments" rows="5" cols="40" placeholder="Please leave any comments or questions here.."></textarea>

            <button type="submit">Submit</button>
           
            

        </form>
        
    </main>

    <footer>
        <p>Copyright &copy;2023 - Nook Resort</p>
        <p>This site is for educational purposes only</p>
    </footer>
</body>
</html>
